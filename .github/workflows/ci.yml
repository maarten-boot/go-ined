# CI (SPEC-007). Every action is pinned to a full commit SHA with its
# version in a comment (SPEC-006); Dependabot keeps them current.
name: CI

on:
  push:
    branches: ["**"] # tags run this through the release workflow
  pull_request:
  workflow_call: # the release workflow runs the same checks first

permissions:
  contents: read

env:
  GO_VERSION: "1.26.11" # = the toolchain line in go.mod (checked by TC-010)
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@v0.8.2
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.9.0
  # cgo headers for Fyne (ined-gui); GLFW 3.4 builds X11 and Wayland support.
  GUI_PACKAGES: gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $GUI_PACKAGES
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run $STATICCHECK ./...
      - name: govulncheck
        run: go run $GOVULNCHECK ./...
      - name: server and CLI without cgo or Fyne
        run: make nogui-check
      - name: go mod verify
        run: go mod verify

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $GUI_PACKAGES
      - name: go test -race (the GUI tests run headless)
        run: go test -race -count=1 ./...

  raw-icmp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build the monitor tests
        run: go test -c -o "$RUNNER_TEMP/monitor.test" ./internal/monitor
      - name: ICMP tests as root, raw sockets forced (TC-309)
        run: sudo INED_TEST_RAW_ICMP=1 "$RUNNER_TEMP/monitor.test" -test.run 'TestICMP' -test.v
        working-directory: internal/monitor

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $GUI_PACKAGES
      - name: build every target (SPEC-007)
        run: scripts/build-release.sh "dev-${GITHUB_SHA::12}" "$RUNNER_TEMP/dist"
      - name: check the archives
        run: |
          cd "$RUNNER_TEMP/dist"
          sha256sum -c SHA256SUMS
          tar -xzf go-ined-dev-*-linux-amd64.tar.gz --wildcards '*/ined-server'
          ./go-ined-dev-*-linux-amd64/ined-server -version | grep -q "dev-${GITHUB_SHA::12}"

  # ined-gui on the other platforms (SPEC-007 v0.41). Fyne needs cgo, so
  # each OS builds its own GUI. Only on main, where a release comes from;
  # in a release the release workflow builds and uploads these.
  gui:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, archs: amd64 }
          - { runner: macos-15, archs: arm64 amd64 }
          - { runner: ubuntu-24.04-arm, archs: arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $GUI_PACKAGES
      - name: build ined-gui
        run: scripts/build-release.sh --gui "dev-${GITHUB_SHA::12}" dist ${{ matrix.archs }}
      - name: check the archives
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
          test "$(ls go-ined-gui-* | wc -l)" -eq "$(echo ${{ matrix.archs }} | wc -w)"
          native=go-ined-gui-dev-${GITHUB_SHA::12}-$(go env GOOS)-$(go env GOARCH)
          if [ -f "$native.zip" ]; then 7z x -bd -bso0 "$native.zip"; else tar -xzf "$native.tar.gz"; fi
          "$native"/ined-gui* -version | grep -q "dev-${GITHUB_SHA::12}"
