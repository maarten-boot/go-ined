# go-ined GUI configuration: reference file (SPEC-805).
# Default location: $XDG_CONFIG_HOME/go-ined/gui.toml (falls back to ~/.config/go-ined/gui.toml).
# Every value shown here is the built-in default. Precedence: flags, then INED_URL / INED_TOKEN, then this file.

[server]
url   = "http://127.0.0.1:8470"
token = ""

[contrast]                   # SPEC-003, SPEC-005. The GUI saves changes made in its contrast selector back here.
preset    = "AA"             # AA (4.5:1) | AAA (7:1) | Max (21:1, black and white only) | custom
min_ratio = 4.5              # Used only when preset = "custom". Range 4.5–21.
