# go-ined GUI configuration: reference file (SPEC-805).
# Default location: $XDG_CONFIG_HOME/go-ined/gui.toml (falls back to ~/.config/go-ined/gui.toml).
# Every value shown here is the built-in default. Precedence: flags, then INED_URL / INED_TOKEN, then this file.

[server]
url   = "http://127.0.0.1:8470"
token = ""
# PEM file with extra trusted CA certificates, e.g. for a self-signed server
# certificate. Empty = the system roots only.
ca_cert = ""

[contrast]                   # SPEC-003, SPEC-005. The GUI saves changes made in its contrast selector back here.
preset    = "AA"             # AA (4.5:1) | AAA (7:1) | Max (21:1, black and white only) | custom
min_ratio = 4.5              # Used only when preset = "custom". Range 4.5–21.

[map]                        # SPEC-722. The GUI saves its "Wrap names" toggle back here.
wrap_names = true            # Break long names (after dots) where they would run into a neighbour.

[connect]                    # SPEC-731: the commands behind a host's Connect menu. Web pages open in the browser.
# Split into words like a shell would, but run without a shell. {ip}, {name} and {port} are
# filled in, each as part of one word. Empty = the platform's default:
#   Linux:   ssh = "x-terminal-emulator -e ssh {ip}"   rdp = "remmina -c rdp://{ip}"   vnc = "remmina -c vnc://{ip}:{port}"
#   macOS:   ssh = "open ssh://{ip}"                   rdp = "open rdp://full%20address=s:{ip}"   vnc = "open vnc://{ip}:{port}"
#   Windows: ssh = "cmd /c start ssh {ip}"             rdp = "mstsc /v:{ip}"           vnc = "cmd /c start vnc://{ip}:{port}"
# Example with a fixed user: ssh = "x-terminal-emulator -e ssh admin@{ip}"
ssh = ""
rdp = ""
vnc = ""
