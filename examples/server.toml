# go-ined server configuration: reference file (SPEC-805).
# Default location: $XDG_CONFIG_HOME/go-ined/server.toml (falls back to ~/.config/go-ined/server.toml).
# Every value shown here is the built-in default. Command-line flags override this file.

[server]
listen     = "127.0.0.1:8470"  # Non-loopback addresses require a token (SPEC-802).
token      = ""                # Bearer token. Empty = no auth (loopback only).
read_token = ""                # A second token that may only read (GET, events), e.g. for ined-alert; needs token (SPEC-808).
tls_cert   = ""                # Set both tls_cert and tls_key to turn on TLS (SPEC-803).
tls_key    = ""

[storage]
db_path = ""                 # Empty = $XDG_DATA_HOME/go-ined/ined.db (falls back to ~/.local/share/go-ined/ined.db).

[monitor]                    # SPEC-301, SPEC-302
enabled    = true            # false = no pinging at all; hosts keep their stored status.
interval   = "60s"           # Time between ping rounds for each host.
count      = 3               # Echo requests per round.
timeout    = "1s"            # How long to wait for each reply.
down_after = 2               # Failed rounds in a row before a host is marked down.

[discovery]                  # SPEC-203
max_prefix  = 16             # Largest range allowed (smallest prefix length): /16.
rate        = 200            # Probes per second.
concurrency = 64             # Probes in flight at the same time.
scheduled   = true           # Scan network groups again on their own schedule ("Rescan", SPEC-206);
                             # false runs none of them (the groups keep their setting).

[dns]                        # SPEC-401
enabled     = true           # false = no reverse lookups; PTR names stay as stored.
refresh     = "1h"           # PTR refresh interval.
concurrency = 20             # Lookups running at the same time.

[services]                   # SPEC-309: which of SSH, RDP, VNC (5900-5909), HTTP, HTTPS a host offers.
enabled = true               # false = no checks, not even on request; the Connect menu shows no ticks.
refresh = "6h"               # Time between checks of a monitored host. New hosts are checked at once.
timeout = "1s"               # How long one TCP connect may take.
watch_interval = "5m"        # SPEC-310: time between checks of a watched service (at least 10s).
watch_down_after = 2         # Failed checks in a row before a watched service is down.
watch_concurrency = 50       # Connects to watched services at the same time.

[snmp]                       # SPEC-312-314: find SNMP agents and read CPU, disks, memory and uptime.
enabled     = false          # Off by default: community strings go out in clear text to every host tried.
communities = ["public"]     # Tried in this order, each with v2c and then v1. Keep this file private (mode 0600).
networks    = []             # Where they may be tried, e.g. ["10.0.0.0/8", "192.168.1.0/24"]; empty = everywhere.
port        = 161            # UDP port of the agents.
timeout     = "1s"           # Per request.
retries     = 1              # Extra tries of a request without an answer (0-5).
concurrency = 20             # Hosts checked at the same time.
interval    = "5m"           # Time between value reads of a host with an agent (at least 10s).
rescan      = "24h"          # Time before a host where nothing answered is tried again (at least 1m).

[events]                     # SPEC-503
buffer = 1000                # Events kept for Last-Event-ID replay.

[log]                        # SPEC-807
level  = "info"              # debug | info | warn | error. Flag: -log-level.
format = "text"              # text | json. The log goes to stderr.
